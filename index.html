<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yandex OAuth Integration</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Yandex API Token Generator</h1>
        </div>
        
        <!-- Section 1: Initialize Yandex OAuth -->
        <div class="card">
            <h2 class="card-title">Initialize Connection</h2>
            <button id="connectButton" class="button">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v14M5 12h14"></path>
                </svg>
                Get Code
            </button>
        </div>
        
        <!-- Section 2: Input Authorization Code -->
        <div class="card">
            <h2 class="card-title">Authorization Code</h2>
            <div class="input-group">
                <input type="text" id="authCode" class="input" placeholder="Enter the code here">
            </div>
            <button id="submitCode" class="button">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                Submit Code
            </button>
        </div>
        
        <!-- Notification Area -->
        <div id="notification" class="notification hidden">
            <div class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
            </div>
            <span id="notificationMessage"></span>
        </div>
    </div>
    
    <script>
        // Get elements
        const connectButton = document.getElementById('connectButton');
        const submitCodeButton = document.getElementById('submitCode');
        const authCodeInput = document.getElementById('authCode');
        const notification = document.getElementById('notification');
        const notificationMessage = document.getElementById('notificationMessage');
        
        // Get configuration from environment (in a real implementation, this would be server-side)
        const clientId = "513f041567bc4b46a9780a675bb88d5e"; // This should be secured in a real application
        const redirectUri = "https://oauth.yandex.ru/verification_code  ";
        
        // Connect to Yandex button event
        connectButton.addEventListener('click', () => {
            // Open Yandex OAuth in a new tab
            const oauthUrl = `https://oauth.yandex.ru/authorize?response_type=code&client_id=${clientId}&redirect_uri=${redirectUri}`;
            window.open(oauthUrl, '_blank');
        });
        
        // Submit code button event
        submitCodeButton.addEventListener('click', async () => {
            const code = authCodeInput.value.trim();
            
            if (!code) {
                showNotification('Please enter the authorization code', 'error');
                return;
            }
            
            try {
                // Send code to Yandex Cloud Function
                const response = await sendCodeToCloudFunction(code);
                
                if (response.success) {
                    showNotification(`Success! Token received for user: ${response.username}`, 'success');
                    authCodeInput.value = ''; // Clear input field on success
                } else {
                    showNotification(`Error: ${response.error}`, 'error');
                }
            } catch (error) {
                showNotification(`Error: ${error.message}`, 'error');
            }
        });

        // Prevent form submission on Enter key in the input field
        authCodeInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                submitCodeButton.click();
            }
        });
        
        // Function to send code to Yandex Cloud Function
        async function sendCodeToCloudFunction(code) {
            try {
                const response = await fetch('  https://functions.yandexcloud.net/d4e4ca65fpkv59epebqs  ', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ code: code })
                });
                
                if (!response.ok) {
                    const errorData = await response.text().catch(() => ({}));
                    throw new Error(`HTTP error! status: ${response.status}. Response body: ${errorData}`);
                }
                
                const data = await response.json();
                
                // Check if the response indicates success
                if (data.success || data.token) {
                    return {
                        success: true,
                        username: data.username || 'unknown',
                        token: data.token
                    };
                } else {
                    return {
                        success: false,
                        error: data.error || 'Unknown error from Cloud Function'
                    };
                }
            } catch (error) {
                console.error('Error sending code to Cloud Function:', error);
                return {
                    success: false,
                    error: error.message || 'Failed to connect to Cloud Function'
                };
            }
        }
        
        // Function to show notification
        function showNotification(message, type) {
            notificationMessage.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.remove('hidden');
            
            // Change icon based on type
            const icon = notification.querySelector('.icon svg');
            if (type === 'success') {
                icon.innerHTML = `
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                `;
                
                // Auto-hide success notification after 5 seconds with fade animation
                setTimeout(() => {
                    notification.classList.add('fade-out');
                    notification.addEventListener('animationend', () => {
                        notification.classList.add('hidden');
                        notification.classList.remove('fade-out');
                    }, { once: true });
                }, 5000);
            } else {
                icon.innerHTML = `
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                `;
            }
        }
    </script>
</body>
</html>
