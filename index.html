<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yandex OAuth Token Handler</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="styles.css">
    <style type="text/tailwindcss">
@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-secondary: var(--secondary);
  --color-secondary-foreground: var(--secondary-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-accent: var(--accent);
  --color-accent-foreground: var(--accent-foreground);
  --color-destructive: var(--destructive);
  --color-destructive-foreground: var(--destructive-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --color-chart-1: var(--chart-1);
  --color-chart-2: var(--chart-2);
  --color-chart-3: var(--chart-3);
  --color-chart-4: var(--chart-4);
  --color-chart-5: var(--chart-5);
  --color-sidebar: var(--sidebar);
  --color-sidebar-foreground: var(--sidebar-foreground);
  --color-sidebar-primary: var(--sidebar-primary);
  --color-sidebar-primary-foreground: var(--sidebar-primary-foreground);
  --color-sidebar-accent: var(--sidebar-accent);
  --color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
  --color-sidebar-border: var(--sidebar-border);
  --color-sidebar-ring: var(--sidebar-ring);

  --font-sans: var(--font-sans);
  --font-mono: var(--font-mono);
  --font-serif: var(--font-serif);

  --radius-sm: calc(var(--radius) - 4px);
  --radius-md: calc(var(--radius) - 2px);
  --radius-lg: var(--radius);
  --radius-xl: calc(var(--radius) + 4px);

  --shadow-2xs: var(--shadow-2xs);
  --shadow-xs: var(--shadow-xs);
  --shadow-sm: var(--shadow-sm);
  --shadow: var(--shadow);
  --shadow-md: var(--shadow-md);
  --shadow-lg: var(--shadow-lg);
  --shadow-xl: var(--shadow-xl);
  --shadow-2xl: var(--shadow-2xl);
}
    </style>
</head>
<body class="bg-background text-foreground font-sans min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md space-y-8">
        <!-- Header -->
        <div class="text-center">
            <h1 class="text-3xl font-bold tracking-tight">Yandex OAuth</h1>
            <p class="mt-2 text-muted-foreground">Secure token handler and webhook integrator</p>
        </div>

        <!-- Main Card -->
        <div class="bg-card text-card-foreground rounded-xl border border-border shadow-sm overflow-hidden">
            <div class="p-6 space-y-6">
                
                <!-- Status Notification -->
                <div id="status-container" class="hidden rounded-lg p-4 text-sm" role="alert">
                    <div class="flex items-center gap-3">
                        <span id="status-icon" class="text-lg"></span>
                        <div class="flex-1">
                            <h3 id="status-title" class="font-medium"></h3>
                            <p id="status-message" class="text-muted-foreground mt-1"></p>
                        </div>
                    </div>
                </div>

                <!-- Action Area -->
                <div id="action-container" class="flex flex-col gap-4">
                    <!-- Initial State: Login Button -->
                    <button id="login-btn" class="bg-primary text-primary-foreground hover:opacity-90 h-11 px-8 rounded-md inline-flex items-center justify-center whitespace-nowrap text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 w-full cursor-pointer">
                        Connect Yandex Account
                    </button>

                    <!-- Loading State -->
                    <div id="loading-state" class="hidden flex-col items-center justify-center py-4 space-y-4">
                        <div class="w-8 h-8 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
                        <p class="text-sm text-muted-foreground animate-pulse">Processing authentication...</p>
                    </div>

                    <!-- Retry Button (Hidden by default) -->
                    <button id="retry-btn" class="hidden border border-input bg-background hover:bg-accent hover:text-accent-foreground h-11 px-8 rounded-md inline-flex items-center justify-center whitespace-nowrap text-sm font-medium transition-colors w-full cursor-pointer">
                        Retry Webhook
                    </button>
                </div>
            </div>
            
            <!-- Footer/Info -->
            <div class="bg-muted/50 p-4 border-t border-border text-xs text-center text-muted-foreground">
                <p>Tokens are securely passed to the configured webhook.</p>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
