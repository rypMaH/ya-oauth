<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yandex Auth Connector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<div class="w-full max-w-lg bg-white rounded-2xl shadow-xl overflow-hidden fade-in border border-slate-200">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden fade-in border border-slate-200">
        
        <!-- Header -->
        <div class="bg-yellow-300 p-6 text-black text-center">
            <h1 class="font-bold text-xl flex items-center justify-center gap-2">
                <i class="fab fa-yandex text-red-600 bg-white rounded-full px-1.5 py-0.5 text-sm"></i>
                <span>Yandex OAuth Connector</span>
            </h1>
        </div>

        <div class="p-8">
            
            <!-- STEP 1: LOGIN BUTTON -->
            <div id="step-start" class="text-center">
                <p class="text-sm text-gray-600 mb-6">
                    Нажмите, чтобы авторизоваться через Яндекс и отправить данные в систему.
                </p>

                <button onclick="app.login()" class="w-full bg-yellow-300 hover:bg-yellow-400 text-black font-bold py-4 px-6 rounded-xl shadow-lg shadow-yellow-500/20 transition transform active:scale-95 flex items-center justify-center gap-3">
                    <i class="fab fa-yandex text-xl"></i>
                    <span>Войти через Яндекс</span>
                </button>
            </div>

            <!-- STEP 2: PROCESSING -->
            <div id="step-loading" class="hidden text-center py-4">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-slate-200 border-t-red-600 mb-4"></div>
                <h3 class="font-bold text-lg text-slate-800" id="loading-title">Обработка</h3>
                <p class="text-sm text-slate-500" id="loading-text">Связь с сервером...</p>
            </div>

            <!-- STEP 3: SUCCESS -->
            <div id="step-success" class="hidden text-center">
                <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4 text-green-600">
                    <i class="fas fa-check text-2xl"></i>
                </div>
                <h3 class="font-bold text-green-800 text-xl mb-2">Успешно!</h3>
                <p class="text-sm text-gray-600 mb-6">
                    Токен и данные профиля отправлены в систему.
                </p>

                <div class="bg-slate-50 rounded-lg p-4 text-left text-sm font-mono border border-slate-200 mb-6">
                    <div class="flex justify-between mb-2">
                        <span class="text-gray-400">User:</span>
                        <span id="res-login" class="font-semibold text-slate-700">...</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-400">Token:</span>
                        <span id="res-token" class="font-semibold text-blue-700">...</span>
                    </div>
                </div>

                <button onclick="app.reset()" class="w-full border border-slate-300 text-slate-600 font-medium py-2 rounded-lg hover:bg-slate-50 transition text-sm">
                    Вернуться назад
                </button>
            </div>

            <!-- STEP 4: ERROR -->
            <div id="step-error" class="hidden text-center">
                <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4 text-red-600">
                    <i class="fas fa-times text-2xl"></i>
                </div>
                <h3 class="font-bold text-red-800 text-xl mb-2">Ошибка</h3>
                <p id="error-msg" class="text-sm text-red-600 bg-red-50 p-3 rounded-lg mb-6 break-words">...</p>
                
                <button onclick="app.reset()" class="w-full bg-slate-800 text-white font-medium py-2 rounded-lg hover:bg-slate-900 transition">
                    Попробовать снова
                </button>
            </div>

        </div>
    </div>

    <script>
        // КОНФИГУРАЦИЯ
        const CONFIG = {
            clientId: '513f041567bc4b46a9780a675bb88d5e',
            webhookUrl: 'https://n8n.riddler.digital/webhook-test/yandex-oauth'
        };

        const app = {
            // Динамически определяем текущий URL (Redirect URI)
            // Это позволяет работать и локально, и на GitHub Pages без смены кода
            currentUri: window.location.href.split('#')[0],

            init() {
                // Проверяем, вернулся ли пользователь с токеном
                const hash = window.location.hash;
                if (hash && hash.includes('access_token')) {
                    this.handleCallback(hash);
                }
            },

            login() {
                // Формируем URL для авторизации (Implicit Flow)
                const authUrl = `https://oauth.yandex.ru/authorize?` + 
                    `response_type=token` + 
                    `&client_id=${CONFIG.clientId}` + 
                    `&redirect_uri=${encodeURIComponent(this.currentUri)}`;

                window.location.href = authUrl;
            },

            async handleCallback(hash) {
                this.showStep('loading');
                
                // 1. Извлекаем токен из URL
                const params = new URLSearchParams(hash.substring(1));
                const accessToken = params.get('access_token');
                
                // Очищаем адресную строку
                window.history.replaceState(null, null, this.currentUri);

                if (!accessToken) {
                    this.showError('Токен авторизации не найден.');
                    return;
                }

                try {
                    // 2. Получаем данные профиля от Яндекса
                    this.setLoadingStatus('Профиль...', 'Получаем данные пользователя');
                    
                    const userRes = await fetch('https://login.yandex.ru/info?format=json', {
                        headers: { 'Authorization': `OAuth ${accessToken}` }
                    });

                    if (!userRes.ok) throw new Error('Ошибка получения профиля (API Яндекса)');
                    const userInfo = await userRes.json();

                    // 3. Отправляем всё на Webhook
                    this.setLoadingStatus('Отправка...', 'Передаем данные в n8n');
                    await this.sendToWebhook(accessToken, userInfo);

                } catch (error) {
                    this.showError(error.message);
                }
            },

            async sendToWebhook(token, userInfo) {
                const payload = {
                    source: 'yandex_oauth_app',
                    timestamp: new Date().toISOString(),
                    auth: { access_token: token },
                    user: userInfo
                };

                try {
                    // Пытаемся отправить данные
                    // Используем no-cors как fallback, чтобы не пугать пользователя ошибками консоли,
                    // если n8n не настроен на отправку CORS заголовков.
                    try {
                        await fetch(CONFIG.webhookUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                    } catch (corsError) {
                        console.warn('Стандартный fetch не прошел, пробуем no-cors mode', corsError);
                        await fetch(CONFIG.webhookUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                    }

                    // Успех
                    document.getElementById('res-login').textContent = userInfo.login;
                    document.getElementById('res-token').textContent = token;
                    this.showStep('success');

                } catch (e) {
                    console.error(e);
                    this.showError('Не удалось отправить данные на Webhook.');
                }
            },

            setLoadingStatus(title, text) {
                document.getElementById('loading-title').textContent = title;
                document.getElementById('loading-text').textContent = text;
            },

            showStep(stepName) {
                ['start', 'loading', 'success', 'error'].forEach(step => {
                    document.getElementById(`step-${step}`).classList.add('hidden');
                });
                document.getElementById(`step-${stepName}`).classList.remove('hidden');
            },

            showError(msg) {
                document.getElementById('error-msg').textContent = msg;
                this.showStep('error');
            },

            reset() {
                this.showStep('start');
            }
        };

        // Запуск
        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
