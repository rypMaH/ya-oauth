<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yandex OAuth Token Handler</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    
    <!-- Preload styles to minimize network delay -->
    <link rel="preload" href="styles.css" as="fetch" crossorigin="anonymous">

    <style>
        /* Anti-FOUC: Hide content until styles are loaded */
        body {
            opacity: 0;
            transition: opacity 0.2s ease-in;
        }
    </style>

    <script>
        // Load styles.css and inject as Tailwind configuration
        fetch('styles.css')
            .then(r => r.text())
            .then(css => {
                const style = document.createElement('style');
                style.type = 'text/tailwindcss';
                style.textContent = css;
                document.head.appendChild(style);

                // Reveal body after styles are injected
                // Double RAF ensures paint cycle has processed the new styles
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        document.body.style.opacity = '1';
                    });
                });
            })
            .catch(e => {
                console.error('Failed to load styles:', e);
                // Fallback: show content anyway so it's not permanently invisible
                document.body.style.opacity = '1';
            });
    </script>
</head>
<body class="bg-background text-foreground font-sans min-h-screen flex items-center justify-center p-4">
    <!-- Main Card Container -->
    <div class="w-full max-w-sm bg-card text-card-foreground rounded-md shadow-sm overflow-hidden border border-border">
        
        <!-- Header Section -->
        <div class="p-8 pb-4 text-center">
            <h1 class="text-3xl font-bold tracking-tight mb-2">
                <span class="text-yandex-red">Y</span>andex OAuth
            </h1>
            <p class="text-muted-foreground text-sm">Для авторизации и получения API токена Яндекса нажмите на кнопку</p>
        </div>

        <div class="p-8 pt-2 space-y-6">
            
            <!-- Status Notification -->
            <div id="status-container" class="hidden rounded-md p-4 text-sm" role="alert">
                <div class="flex items-start gap-3">
                    <span id="status-icon" class="text-lg mt-0.5"></span>
                    <div class="flex-1">
                        <h3 id="status-title" class="font-bold"></h3>
                        <p id="status-message" class="mt-1 opacity-90"></p>
                    </div>
                </div>
            </div>

            <!-- Action Area -->
            <div id="action-container" class="flex flex-col gap-3 items-center">
                <!-- User Info (Hidden by default) -->
                <div id="user-info" class="hidden flex-col items-center gap-3 py-2 w-full">
                    <div class="relative flex flex-col items-center w-full max-w-[220px]">
                        <!-- Account Selector Button -->
                        <button id="account-selector-btn" class="w-full flex items-center gap-3 p-2 rounded-md border border-border bg-card hover:bg-muted transition-colors text-left focus:outline-none focus:ring-2 focus:ring-ring">
                            <img id="user-avatar" src="" alt="Avatar" class="w-10 h-10 rounded-full border border-border object-cover bg-muted shrink-0">
                            <div class="flex-1 min-w-0">
                                <p id="user-login" class="font-semibold text-foreground text-sm truncate"></p>
                                <p id="user-name" class="text-xs text-muted-foreground truncate"></p>
                            </div>
                            <svg class="w-4 h-4 text-muted-foreground shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>

                        <!-- Accounts Dropdown List (Hidden by default) -->
                        <div id="accounts-dropdown" class="hidden absolute top-full left-0 w-full mt-1 bg-card border border-border rounded-md shadow-lg overflow-hidden flex-col z-50">
                            <div id="accounts-list" class="max-h-40 overflow-y-auto flex flex-col">
                                <!-- Accounts will be injected here -->
                            </div>
                            <div class="border-t border-border">
                                <button id="add-account-btn" class="w-full flex items-center gap-2 p-3 text-sm text-primary hover:bg-muted transition-colors text-left font-medium">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                                    Добавить аккаунт
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Initial State: Login Button -->
                <button id="login-btn" class="bg-primary text-primary-foreground hover:bg-[#e6b800] h-12 px-8 rounded-md inline-flex items-center justify-center whitespace-nowrap text-base font-normal transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 w-3/4 cursor-pointer shadow-sm">
                    Connect Yandex Account
                </button>

                <!-- Loading State -->
                <div id="loading-state" class="hidden flex-col items-center justify-center py-4 space-y-3">
                    <div class="w-6 h-6 border-2 border-primary border-t-transparent rounded-full animate-spin"></div>
                    <p class="text-sm text-muted-foreground">Processing...</p>
                </div>

                <!-- Retry Button (Hidden by default) -->
                <button id="retry-btn" class="hidden border border-input bg-white hover:bg-gray-50 text-foreground h-12 px-8 rounded-md inline-flex items-center justify-center whitespace-nowrap text-base font-normal transition-colors w-3/4 cursor-pointer">
                    Retry Webhook
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
