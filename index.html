<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yandex Auth Connector</title>
    <link rel="icon" type="image/x-icon" href="https://yandex.ru/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-xl bg-white rounded-2xl shadow-xl overflow-hidden fade-in border border-slate-200">
        
        <!-- Header -->
        <div class="bg-yellow-300 p-6 text-black text-center">
            <h1 class="font-bold text-xl flex items-center justify-center gap-2">
                <i class="fab fa-yandex text-red-600 bg-white rounded-full px-1.5 py-0.5 text-sm"></i>
                <span>Yandex OAuth Connector</span>
            </h1>
        </div>

        <div class="p-8">
            
            <!-- STEP 1: LOGIN BUTTON -->
            <div id="step-start" class="text-center">
                <p class="text-sm text-gray-600 mb-6">
                    Нажмите, чтобы авторизоваться через Яндекс и получить API токен.
                </p>

                <button onclick="app.login()" class="w-full bg-yellow-300 hover:bg-yellow-400 text-black font-bold py-4 px-6 rounded-xl shadow-lg shadow-yellow-500/20 transition transform active:scale-95 flex items-center justify-center gap-3">
                    <i class="fab fa-yandex text-xl"></i>
                    <span>Войти через Яндекс</span>
                </button>
            </div>

            <!-- STEP 2: PROCESSING -->
            <div id="step-loading" class="hidden text-center py-4">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-slate-200 border-t-red-600 mb-4"></div>
                <h3 class="font-bold text-lg text-slate-800" id="loading-title">Обработка</h3>
                <p class="text-sm text-slate-500" id="loading-text">Связь с сервером...</p>
            </div>

            <!-- STEP 3: SUCCESS -->
            <div id="step-success" class="hidden text-center">
                <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4 text-green-600">
                    <i class="fas fa-check text-2xl"></i>
                </div>
                <h3 class="font-bold text-green-800 text-xl mb-2">Успешно!</h3>
                <p class="text-sm text-gray-600 mb-6">
                    Токен и данные профиля отправлены в систему.
                </p>

                <div class="bg-slate-50 rounded-lg p-4 text-left text-xs font-mono border border-slate-200 mb-6">
                    <div class="flex justify-between mb-2">
                        <span class="text-gray-400">User:</span>
                        <span id="res-login" class="font-bold text-slate-700">...</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-400">Token:</span>
                        <span id="res-token" class="font-bold text-blue-700">...</span>
                    </div>
                </div>

                <button onclick="app.reset()" class="w-full border border-slate-300 text-slate-600 font-medium py-2 rounded-lg hover:bg-slate-50 transition text-sm">
                    Вернуться назад
                </button>
            </div>

            <!-- STEP 4: ERROR -->
            <div id="step-error" class="hidden text-center">
                <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4 text-red-600">
                    <i class="fas fa-times text-2xl"></i>
                </div>
                <h3 class="font-bold text-red-800 text-xl mb-2">Ошибка</h3>
                <p id="error-msg" class="text-sm text-red-600 bg-red-50 p-3 rounded-lg mb-6 break-words">...</p>
                
                <button onclick="app.reset()" class="w-full bg-slate-800 text-white font-medium py-2 rounded-lg hover:bg-slate-900 transition">
                    Попробовать снова
                </button>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
